<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Queue UI sketch</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #121a2b;
      --card: #182236;
      --border: #2a3750;
      --text: #e8eef9;
      --muted: #8b9bb8;
      --accent: #3b9eff;
      --accent-dim: #1e4a7a;
      --danger: #e85d6a;
      --ok: #3ecf8e;
      --locked: #3a455c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      padding: 0.75rem 1.25rem;
      border-bottom: 1px solid var(--border);
      background: #0e1626;
    }
    .logo { font-weight: 700; letter-spacing: 0.02em; }
    nav a {
      color: var(--muted);
      text-decoration: none;
      margin-right: 1rem;
      font-size: 0.9rem;
    }
    nav a.active { color: var(--text); border-bottom: 2px solid var(--accent); padding-bottom: 2px; }
    .chips { margin-left: auto; display: flex; gap: 0.4rem; align-items: center; }
    .chip {
      font-size: 0.75rem;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .chip.on { background: var(--accent-dim); border-color: var(--accent); color: var(--text); }
    .avatar-sm {
      width: 28px; height: 28px; border-radius: 50%;
      background: linear-gradient(135deg, #456, #234);
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    main {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1rem;
      padding: 1rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
    }
    .col {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.85rem;
      min-height: 480px;
    }
    .col h2 {
      margin: 0 0 0.75rem;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; align-items: flex-start; }
    .tab {
      font-size: 0.8rem;
      padding: 0.35rem 0.7rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
    }
    .tab.active { background: var(--card); color: var(--text); border-color: var(--accent); }
    .tab.locked {
      opacity: 0.5;
      border-style: dashed;
    }
    .tab.locked small {
      display: block;
      font-size: 0.65rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.7rem;
      margin-bottom: 0.6rem;
    }
    .meta { font-size: 0.75rem; color: var(--muted); margin-bottom: 0.5rem; }
    .player {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0;
      font-size: 0.88rem;
    }
    .player .name-rank {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      min-width: 0;
    }
    .rank {
      width: 14px; height: 14px;
      display: inline-block;
      clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
      background: #6eb6ff;
      flex-shrink: 0;
    }
    .rank.gold { background: #e0b44a; }
    .rank.silver { background: #a8b4c8; }
    .role {
      margin-left: auto;
      font-size: 0.65rem;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 0.1rem 0.35rem;
      border-radius: 4px;
    }
    .btn {
      display: inline-block;
      font-size: 0.78rem;
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      border: none;
      margin-top: 0.45rem;
      margin-right: 0.35rem;
    }
    .btn.primary { background: var(--accent); color: #061018; font-weight: 600; }
    .btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn.danger { background: transparent; color: var(--danger); border: none; padding-left: 0; }
    .btn.ok { background: var(--ok); color: #062016; font-weight: 600; }
    .stack {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-wrap: wrap;
      margin-bottom: 0.4rem;
    }
    .stack .avatar-sm { width: 24px; height: 24px; }
    .delta {
      font-size: 0.72rem;
      color: var(--ok);
      border: 1px solid #2a5a44;
      background: #123528;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
    }
    .invite-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    .invite-row .who {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.88rem;
    }
    .actions { display: flex; gap: 0.35rem; }
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.75rem;
      padding: 0.75rem;
    }
    .note {
      max-width: 1200px;
      margin: 0.75rem auto 0;
      padding: 0 1rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .subhead {
      margin: 1rem 0 0.5rem;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding-top: 0.75rem;
    }
    .invite-link {
      display: flex;
      gap: 0.4rem;
      margin: 0.6rem 0 0.35rem;
      align-items: center;
    }
    .invite-link input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      font-size: 0.72rem;
      padding: 0.4rem 0.5rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Kart Queue</div>
    <nav>
      <a class="active" href="#">Queue</a>
      <a href="#">Match</a>
      <a href="#">Profile</a>
    </nav>
    <div class="chips">
      <span class="chip on">RT</span>
      <span class="chip on">Ranked</span>
      <span class="chip">CT</span>
      <span class="chip">Casual</span>
      <div class="avatar-sm" title="you"></div>
    </div>
  </header>

  <main>
    <section class="col">
      <h2>My Group</h2>
      <div class="card">
        <div class="meta">RT · Ranked · 3/5</div>
        <div class="player">
          <div class="avatar-sm"></div>
          <span class="name-rank">yoshi <span class="rank gold"></span></span>
          <span class="role">Runner</span>
        </div>
        <div class="player">
          <div class="avatar-sm"></div>
          <span class="name-rank">nova <span class="rank"></span></span>
          <span class="role">Bagger</span>
        </div>
        <div class="player">
          <div class="avatar-sm"></div>
          <span class="name-rank">kai <span class="rank silver"></span></span>
          <span class="role">Runner</span>
        </div>
        <div class="invite-link">
          <input readonly value="https://…/q?invite=abc" />
          <button class="btn ghost" style="margin:0">Copy</button>
        </div>
        <button class="btn primary">Post to hub</button>
        <div><button class="btn danger">Leave</button></div>
      </div>

      <div class="subhead">Invited</div>
      <div class="card invite-row">
        <div class="who">
          <div class="avatar-sm"></div>
          <span>Zara</span>
          <span class="rank gold"></span>
        </div>
        <button class="btn danger" style="margin:0">Undo</button>
      </div>
    </section>

    <section class="col">
      <h2>Available</h2>

      <div class="card">
        <div class="meta">3/5</div>
        <div class="stack">
          <div class="avatar-sm"></div><span style="font-size:0.8rem">mira</span><span class="rank gold"></span>
          <div class="avatar-sm"></div><span style="font-size:0.8rem">jax</span><span class="rank"></span>
          <div class="avatar-sm"></div><span style="font-size:0.8rem">ren</span><span class="rank silver"></span>
        </div>
        <button class="btn primary">Invite</button>
      </div>

      <div class="card">
        <div class="meta">4/5</div>
        <div class="stack">
          <div class="avatar-sm"></div><span style="font-size:0.8rem">ash</span><span class="rank"></span>
          <div class="avatar-sm"></div><span style="font-size:0.8rem">leo</span><span class="rank gold"></span>
          <div class="avatar-sm"></div><span style="font-size:0.8rem">sam</span><span class="rank"></span>
          <div class="avatar-sm"></div><span style="font-size:0.8rem">ivy</span><span class="rank silver"></span>
        </div>
        <button class="btn primary">Invite</button>
      </div>

      <div class="card">
        <div class="meta">2/5 · 19:00</div>
        <div class="stack">
          <div class="avatar-sm"></div><span style="font-size:0.8rem">pix</span><span class="rank"></span>
          <div class="avatar-sm"></div><span style="font-size:0.8rem">dot</span><span class="rank gold"></span>
        </div>
        <button class="btn primary">Invite</button>
      </div>
    </section>

    <section class="col">
      <h2>Invitations</h2>

      <div class="card invite-row">
        <div class="who">
          <div class="avatar-sm"></div>
          <span>Nova</span>
          <span class="rank"></span>
          <span class="role" style="margin-left:0.35rem">Runner</span>
        </div>
        <div class="actions">
          <button class="btn ok">Accept</button>
          <button class="btn ghost">Deny</button>
        </div>
      </div>
    </section>
  </main>

  <footer>Connected</footer>
</body>
</html>
